<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Geist, ui-sans-serif, system-ui, sans-serif; background: #121212; }
    a { color: #72a1ff; } a:hover { color: #a8c4ff; }
    .aside { display: flex; flex-direction: column; width: 240px; height: 900px;
             border-right: 1px solid rgba(255,255,255,0.1); background: #171717; color: #fafafa; }
    .hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
           border-radius: 10px; border: 1px solid transparent; background: transparent; color: #fafafa;
           cursor: pointer; padding: 0; }
    .btn-outline { border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.045); }
    .btn:hover { background: rgba(38,38,38,0.5); }
    .srch { padding: 0 8px 8px; }
    .input { box-sizing: border-box; width: 100%; height: 36px; border-radius: 8px;
             border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.045);
             padding: 4px 12px; font: 400 14px/1.4 Geist, system-ui, sans-serif; color: #fafafa; outline: none; }
    .input::placeholder { color: #a1a1a1; }
    .list { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
    .cathdr { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; background: transparent;
              border-radius: 8px; padding: 6px 8px; text-align: left; cursor: pointer;
              font: 600 11px/1.25 Geist, system-ui, sans-serif; letter-spacing: 0.025em;
              text-transform: uppercase; color: #a1a1a1; }
    .cathdr:hover { background: #262626; color: #fafafa; }
    .chev { width: 12px; flex-shrink: 0; font-size: 9px; }
    .catname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 4px; padding: 4px; }
    .tile { display: flex; min-width: 0; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; border: 0; border-radius: 8px; background: transparent; padding: 4px; cursor: pointer;
            color: #fafafa; }
    .tile:hover { background: #262626; }
    .ico { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; flex-shrink: 0; }
    .ico img { width: 28px; height: 28px; display: block; }
    .chip { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center;
            border-radius: 6px; background: #262626; font-size: 10px; font-weight: 600; color: #d4d4d4; }
    .lbl { width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           font-size: 9px; line-height: 1.25; }
  </style>
</helmet>
<div class="aside">
  <div class="hdr">
    <button class="btn btn-outline" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="btn" aria-label="Hide objects">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/></svg>
    </button>
  </div>
  <div class="srch">
    <input class="input" type="text" placeholder="Search objects..." value="{{query}}" onInput="{{onQuery}}">
  </div>
  <div class="list">
    <sc-for list="{{cats}}" as="cat" hint-placeholder-count="12">
      <div>
        <button class="cathdr" onClick="{{cat.toggle}}">
          <span class="chev">{{cat.chev}}</span>
          <span class="catname">{{cat.c}}</span>
        </button>
        <sc-if value="{{cat.open}}" hint-placeholder-val="{{false}}">
          <div class="grid">
            <sc-for list="{{cat.items}}" as="item" hint-placeholder-count="6">
              <button class="tile" style="{{item.style}}" onClick="{{item.pick}}">
                <span class="ico">
                  <sc-if value="{{item.hasIcon}}" hint-placeholder-val="{{true}}">
                    <img src="{{item.i}}" alt="{{item.n}}">
                  </sc-if>
                  <sc-if value="{{item.noIcon}}" hint-placeholder-val="{{false}}">
                    <span class="chip">{{item.ab}}</span>
                  </sc-if>
                </span>
                <span class="lbl">{{item.n}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":240,"height":900}}'>
__CATALOG__
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: {}, query: '', armed: null }; }
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const cats = [];
    for (const cat of CATALOG) {
      const items = q ? cat.items.filter((i) => i.n.toLowerCase().includes(q)) : cat.items;
      if (q && items.length === 0) continue;
      const open = q ? true : !!this.state.open[cat.c];
      cats.push({
        c: cat.c,
        open: open,
        chev: open ? '▼' : '▶',
        toggle: () => this.setState({ open: { ...this.state.open, [cat.c]: !this.state.open[cat.c] } }),
        items: items.map((i) => {
          const dead = i.t === 'icon';
          const armed = this.state.armed === cat.c + '|' + i.n;
          let style = '';
          if (dead) style = 'opacity:0.4;cursor:default';
          else if (armed) style = 'background:#1447e6;color:#fafafa';
          return {
            n: i.n, i: i.i, hasIcon: !!i.i, noIcon: !i.i,
            ab: i.n.slice(0, 2),
            style: style,
            pick: dead ? () => {} : () => this.setState({ armed: cat.c + '|' + i.n }),
          };
        }),
      });
    }
    return {
      cats: cats,
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
    };
  }
}
</script>
</body>
</html>
